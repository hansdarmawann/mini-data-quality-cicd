name: Mini Data Quality CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: CI - Run unit tests
        run: python -m unittest discover -s tests -v

      - name: CI - Generate cleaned CSV
        run: python wrangle.py

      - name: CD - Deliver cleaned CSV as artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: cleaned-orders
          path: data/orders_clean.csv
          if-no-files-found: error
          retention-days: 7
